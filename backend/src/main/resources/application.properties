spring.application.name=clase1

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

spring.datasource.url=jdbc:mysql://localhost/bolsa_empleo_db
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración para upload de archivos (CV)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# URL base para acceso público a CVs
app.cv.base-url=http://localhost:8080

# Seguridad de cookie de sesion
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

