<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/head :: head('Login')}"></head>
<body>

<div th:replace="~{fragmentos/nav-publica :: navPublica}"></div>

<main class="page-container">
    <div class="auth-container">
        <div class="auth-card">
            <div th:replace="~{fragmentos/messages :: messages}"></div>

            <h1 class="auth-title">Login</h1>
            <p class="auth-subtitle">Ingrese sus credenciales para entrar al sistema</p>

            <form th:action="@{/login}" th:object="${loginForm}" method="post">
                <div class="form-group">
                    <label for="correo">Correo</label>
                    <input type="email"
                           id="correo"
                           th:field="*{correo}"
                           placeholder="correo@ejemplo.com"
                           required>
                </div>

                <div class="form-group">
                    <label for="clave">Clave</label>
                    <input type="password"
                           id="clave"
                           th:field="*{clave}"
                           placeholder="Ingrese su clave"
                           required>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary w-100">Ingresar</button>
                </div>
            </form>

            <div class="mt-3 text-center">
                <p class="text-muted mb-1">¿No tiene cuenta?</p>
                <div class="actions-row">
                    <a th:href="@{/registro-empresa}" class="btn btn-secondary">Registro Empresa</a>
                    <a th:href="@{/registro-oferentes}" class="btn btn-secondary">Registro Oferente</a>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragmentos/footer :: footer}"></div>

</body>
</html>
