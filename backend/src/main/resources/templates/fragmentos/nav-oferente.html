<header th:fragment="navOferente" class="main-header">
    <nav class="nav-container">
        <div class="nav-left">
            <a th:href="@{/}" class="logo-link">
                <img th:src="@{/assets/logo-empresa.png}" alt="Logo BolsaEmpleo" class="logo-img">
                <span class="logo-text">BolsaEmpleo</span>
            </a>

            <ul class="nav-menu">
                <li><a th:href="@{/oferente/dashboard-oferente}">Dashboard</a></li>
                <li><a th:href="@{/oferente/mis-habilidades-oferente}">Mis habilidades</a></li>
                <li><a th:href="@{/oferente/mi-cv-oferente}">Mi CV</a></li>
            </ul>
        </div>

        <div class="nav-right nav-user-box">
            <span class="nav-user-email"
                  th:if="${session.usuario != null}"
                  th:text="${session.usuario.correo}">
                oferente@correo.com
            </span>
            <a th:href="@{/salir}" class="btn btn-outline-light btn-sm">Salir</a>
        </div>
    </nav>
</header>
